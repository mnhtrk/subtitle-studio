[package]
name = "subtitle-studio"
version = "0.1.0"
description = "Desktop subtitle editor with AI integration"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "image-ico"] }
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tauri-plugin-fs = "2.3.2"
tauri-plugin-shell = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
chrono = "0.4"
keyring = "2.3"
tokio-util = "0.7"
regex = "1.10"
zip = "0.6"
tauri-plugin-dialog = "2"
printpdf = "0.7"
tempfile = "3.10" 
uuid = { version = "1.8", features = ["v4"] }  
lazy_static = "1.4"
once_cell = "1.19"
